# Dependabot Configuration

version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: America/New_York
    labels:
      - dependencies
      - dependabot
    commit-message:
      prefix: deps
      include: scope

updates:
  # Cargo
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - tech:rust
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Github Actions
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - github-actions
      - ci-cd

  # Git submodules — .standards is the org-wide coding standards submodule
  # (falkcorp/.github). It is a pinned commit, not a live link: without this
  # entry the pin only moves when someone remembers to bump it by hand, and
  # nobody did for months while instructions/go.md grew from 55 lines to 384.
  # CLAUDE.md points contributors and agents at .standards/ as authoritative,
  # so a stale pin silently serves outdated rules.
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    labels:
      - documentation
