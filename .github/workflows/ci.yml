# file: .github/workflows/ci.yml
# version: 1.1.0
# guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
# last-edited: 2026-08-04

name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    RUST_VERSION: "stable"
    RUSTFLAGS: "-D warnings"

permissions:
    contents: read
    checks: write

jobs:
    # Detect what files changed to optimize workflow execution
    detect-changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        outputs:
            rustfiles: ${{ steps.filter.outputs.rustfiles }}
            docsfiles: ${{ steps.filter.outputs.docsfiles }}
            protofiles: ${{ steps.filter.outputs.protofiles }}
            workflowfiles: ${{ steps.filter.outputs.workflowfiles }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Check file changes
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: |
                      rustfiles:
                        - '**/*.rs'
                        - 'Cargo.toml'
                        - 'Cargo.lock'
                      docsfiles:
                        - '**/*.md'
                        - 'docs/**'
                      protofiles:
                        - '**/*.proto'
                        - 'buf.yaml'
                      workflowfiles:
                        - '.github/workflows/**'

    # Rust linting, formatting, and testing
    test-rust:
        name: Test Rust
        runs-on: ubuntu-latest
        needs: [detect-changes]
        if: needs.detect-changes.outputs.rustfiles == 'true' || needs.detect-changes.outputs.workflowfiles == 'true'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                submodules: recursive

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
              with:
                  toolchain: ${{ env.RUST_VERSION }}
                  components: rustfmt, clippy

            - name: Cache Rust dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build
              run: cargo build --verbose

            - name: Run tests
              run: cargo test --verbose

            - name: Build release
              run: cargo build --release --verbose

    # The wire contract between server and agents
    proto:
        name: Proto Contract
        runs-on: ubuntu-latest
        needs: [detect-changes]
        if: needs.detect-changes.outputs.protofiles == 'true' || needs.detect-changes.outputs.workflowfiles == 'true'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  # The breaking-change check compares against main, so the
                  # history has to be there to compare against.
                  fetch-depth: 0

            # buf is deliberately not in the build path -- codegen is
            # cargo-native, and a fresh clone must build with nothing installed
            # but a Rust toolchain. What runs here is the check cargo cannot
            # make: whether a change to agent.proto is compatible with the
            # agents already speaking it. Server and agents upgrade
            # independently, so a renumbered field is an incident rather than a
            # review comment.
            - name: Lint and check the contract for breaking changes
              uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
              with:
                  setup_only: false
                  lint: true
                  format: false
                  breaking: true
                  # `subdir` is required, not decorative. Without it buf reads
                  # main with whatever module configuration main happens to
                  # have, and names the file relative to that root -- so the
                  # same unchanged file appears under two different paths and
                  # every run reports it as deleted. Pinning the module root on
                  # both sides compares like with like.
                  breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=crates/transcodarr-proto/proto"
                  # The job's verdict is the check result. Commenting needs
                  # `pull-requests: write`, which this workflow deliberately
                  # does not hold -- a contract check has no business writing to
                  # the pull request.
                  pr_comment: false
                  push: false
                  archive: false

    # Lint markdown documentation
    lint-docs:
        name: Lint Documentation
        runs-on: ubuntu-latest
        needs: [detect-changes]
        if: needs.detect-changes.outputs.docsfiles == 'true' || needs.detect-changes.outputs.workflowfiles == 'true'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                submodules: recursive

            - name: Lint markdown
              uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
              with:
                  globs: "**/*.md"

    # Summary of all checks
    ci-summary:
        name: CI Summary
        runs-on: ubuntu-latest
        needs: [test-rust, proto, lint-docs]
        if: always()

        steps:
            - name: Generate summary
              env:
                  TEST_RUST_RESULT: ${{ needs.test-rust.result }}
                  PROTO_RESULT: ${{ needs.proto.result }}
                  LINT_DOCS_RESULT: ${{ needs.lint-docs.result }}
              run: |
                  {
                      echo "# CI Summary"
                      echo ""
                      echo "| Job | Status |"
                      echo "|-----|--------|"
                      echo "| Test Rust | ${TEST_RUST_RESULT} |"
                      echo "| Proto Contract | ${PROTO_RESULT} |"
                      echo "| Lint Docs | ${LINT_DOCS_RESULT} |"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Check for failures
              if: needs.test-rust.result == 'failure' || needs.proto.result == 'failure' || needs.lint-docs.result == 'failure'
              run: |
                  echo "❌ One or more jobs failed"
                  exit 1
